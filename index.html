<style>

*{box-sizing:border-box}

#main,.col{display:flex;flex-direction:column;gap:12px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px}

.nt{display:flex;gap:8px;align-items:flex-start;background:var(--sunken);border-radius:9px;padding:8px 10px}
.nt div{flex:1;min-width:0;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}

.lk{border:0;background:none;color:var(--muted);font-size:12.5px;padding:2px 4px}
.gr{display:flex;align-items:center;gap:8px}

.aviso{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;z-index:70;max-width:90%;text-align:center}
.fecha{display:flex;align-items:center;gap:8px}
.fecha b{flex:1;text-align:center;font-family:var(--display);font-size:16px;text-transform:capitalize}
.cu{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;flex-shrink:0;line-height:1}
.tl{position:relative}
.tl .h{height:44px;border-top:1px solid var(--line);position:relative}
.tl .h span{position:absolute;left:0;top:-8px;width:40px;text-align:right;font-size:10px;color:var(--muted);background:var(--surface);padding-right:4px;font-variant-numeric:tabular-nums}
.tl .ln{position:absolute;left:46px;right:0;top:0;bottom:0}
.tb{position:absolute;border:0;border-radius:6px;padding:2px 6px;color:#fff;font-size:10.5px;line-height:1.25;text-align:left;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.2)}

.mes{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}

.agua{display:flex;align-items:center;justify-content:center;gap:18px}

.lin2{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}

.tot{display:flex;gap:10px;flex-wrap:wrap}
.tot div{flex:1;text-align:center;min-width:88px}
.tot b{font-family:var(--display);font-size:19px;display:block;font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--muted)}
.step{display:flex;align-items:center;gap:12px}
.step .lab{flex:1;min-width:0;font-weight:600;font-size:14px}

.alerta{display:flex;gap:8px;align-items:flex-start;background:var(--sunken);border-left:3px solid var(--warn);border-radius:8px;padding:9px 11px;font-size:13px}

.rep{font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap;background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;line-height:1.55}
.sat{display:flex;align-items:center;gap:10px}

#gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
</style>
</head>

</div>

<div class="wrap">

</div>

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const iso = d => new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const hoy = () => iso(new Date());
const fechaDe = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const mas = (s,n) => { const d = fechaDe(s); d.setDate(d.getDate()+n); return iso(d); };
const difDias = (a,b) => Math.round((fechaDe(b) - fechaDe(a)) / 86400000);
const fLarga = s => { const d = fechaDe(s); return DOWL[d.getDay()] + " " + d.getDate() + " de " + MESES[d.getMonth()]; };
const fCorta = s => { const d = fechaDe(s); return DOW[d.getDay()] + " " + d.getDate() + "/" + (d.getMonth()+1); };
const mins = h => { const [a,b] = (h || "0:0").split(":").map(Number); return a*60 + (b||0); };
const hm = m => String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0");
const dinero = n => "$" + (Number(n)||0).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = (v,d=0) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const G = k => DB[k].length ? DB[k] : (DEF[k] || []);
const propio = k => { if (!DB[k].length && DEF[k]) DB[k] = JSON.parse(JSON.stringify(DEF[k])); return DB[k]; };
const lunesDe = s => mas(s, -((fechaDe(s).getDay() + 6) % 7));
const mesDe = s => s.slice(0,7);
function toast(m){ document.querySelectorAll(".toast").forEach(x => x.remove()); const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function cerrar(){ $("capa").innerHTML = ""; }
function abrir(html){ $("capa").innerHTML = '<div class="velo" id="velo"><div class="hoja" role="dialog" aria-modal="true">' + html + "</div></div>";
  $("velo").addEventListener("click", e => { if (e.target.id === "velo") cerrar(); }); }
const cabeza = t => `<div class="cabeza"><h2>${esc(t)}</h2><button class="x" data-x aria-label="Cerrar">×</button></div>`;
document.addEventListener("click", e => { if (e.target.closest("[data-x]")) cerrar(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") cerrar(); });
function dosPasos(btn, fn){ btn.onclick = () => { if (btn.dataset.ok) fn(); else { btn.dataset.ok = "1"; btn.textContent = "Confirmar: eliminar"; } }; }
function descarga(nombre, texto, tipo){ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([texto], {type:tipo})); a.download = nombre; document.body.appendChild(a); a.click(); a.remove(); toast("Archivo descargado"); }
async function copiar(texto){ try { await navigator.clipboard.writeText(texto); toast("Copiado al portapapeles"); }
  catch(e){ const t = document.createElement("textarea"); t.value = texto; t.style.position = "fixed"; t.style.opacity = "0"; document.body.appendChild(t); t.select();
    try { document.execCommand("copy"); toast("Copiado al portapapeles"); } catch(e2){ toast("No se pudo copiar; usa descargar"); } t.remove(); } }

/* ============================================================
   NÚCLEO DE SINCRONIZACIÓN  (probado en la app de rentas)
   ============================================================ */
function pintaSync(){
  const el = $("sync"), tx = $("syncTx"), ms = KEYS.map(k => meta[k] || {});
  el.className = "sync";
  if (errTx) { el.classList.add("bad"); tx.textContent = errTx; }
  else if (!ms.every(m => m.listo)) tx.textContent = navigator.onLine ? "Cargando tus datos…" : "Sin conexión: esperando la nube";
  else if (ms.some(m => m.pend)) { el.classList.add("busy"); tx.textContent = navigator.onLine ? "Guardando…" : "Sin conexión: se guardará al reconectar"; }
  else if (ms.some(m => m.cache)) { el.classList.add("busy"); tx.textContent = "Sin conexión con la nube"; }
  else { el.classList.add("ok"); tx.textContent = "Sincronizado"; }
}
function guardar(k, callado){
  if (!uid || !(meta[k] && meta[k].listo)) { toast("Tus datos aún están cargando; intenta en un momento"); return false; }
  errTx = "";
  fs.doc("users/" + uid + "/data/" + k).set({ items: JSON.parse(JSON.stringify(DB[k])), updated: firebase.firestore.FieldValue.serverTimestamp() })
    .catch(e => { errTx = "No se guardó en la nube (" + (e.code || e.message) + ")"; pintaSync(); });
  if (!callado) pinta();
  return true;
}
function conectar(){
  KEYS.forEach(k => {
    bajas.push(fs.doc("users/" + uid + "/data/" + k).onSnapshot({includeMetadataChanges:true}, s => {
      const m = s.metadata, items = s.exists ? (s.data().items || []) : [];
      meta[k] = { listo: (meta[k] && meta[k].listo) || !m.fromCache || s.exists, pend: m.hasPendingWrites, cache: m.fromCache };
      const txt = JSON.stringify(items);
      if (txt !== JSON.stringify(DB[k])) { DB[k] = JSON.parse(txt); pinta(); }
      pintaSync();
    }, e => { errTx = "Error de sincronización (" + e.code + ")"; pintaSync(); }));
  });
}
function desconectar(){ bajas.forEach(b => { try { b(); } catch(e){} }); bajas = []; KEYS.forEach(k => { DB[k] = []; delete meta[k]; }); uid = null; }

/* ---------- acceso con Google ---------- */
function gError(e){ const c = e && (e.code || e.message) || "";
  $("gErr").textContent = !c ? "" : c.includes("unauthorized-domain") ? "Este dominio no está autorizado. En Firebase: Authentication → Settings → Dominios autorizados → agrega " + location.hostname
    : c.includes("operation-not-allowed") ? "Falta habilitar Google en Firebase: Authentication → Sign-in method."
    : c.includes("network") ? "Sin conexión a internet." : "No se pudo iniciar sesión (" + c + ")"; }
let entrando = false;
const proveedor = () => { const p = new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account"}); return p; };
async function entrar(){
  if (entrando) return; entrando = true; gError(null);
  try { await auth.signInWithPopup(proveedor()); }
  catch(e){ const c = e.code || "";
    if (/popup-blocked|cancelled-popup-request|operation-not-supported|web-storage-unsupported/.test(c)) {
      try { await auth.signInWithRedirect(proveedor()); return; } catch(e2){ gError(e2); } }
    else if (!/popup-closed-by-user/.test(c)) gError(e); }
  entrando = false;
}
async function arrancar(){
  $("gVer").textContent = "versión " + VERSION; $("ver").textContent = "v" + VERSION;
  if (typeof firebase === "undefined") { $("gMsg").textContent = "No se pudo cargar Firebase. Revisa tu conexión y recarga la página."; return; }
  try {
    firebase.initializeApp(firebaseConfig); auth = firebase.auth(); fs = firebase.firestore();
    try { await fs.enablePersistence({synchronizeTabs:true}); } catch(e){}
    try { await auth.getRedirectResult(); } catch(e){ gError(e); }
    auth.onAuthStateChanged(u => {
      if (u) { uid = u.uid; $("gate").hidden = true; $("quien").textContent = u.email || u.displayName || "Sesión iniciada"; conectar(); pinta(); pintaSync(); }
      else { desconectar(); $("gate").hidden = false; $("gMsg").textContent = "Inicia sesión para ver y sincronizar tus datos en todos tus dispositivos.";
        $("gEntrar").hidden = false; $("gRedir").hidden = false; }
    });
  } catch(e){ $("gMsg").textContent = "Error al iniciar Firebase: " + (e.message || e.code); }
}
$("gEntrar").onclick = entrar;
$("gRedir").onclick = () => { gError(null); auth.signInWithRedirect(proveedor()).catch(gError); };
$("salir").onclick = () => auth.signOut().then(() => location.reload());
window.addEventListener("online", pintaSync); window.addEventListener("offline", pintaSync);

const hogarDiario = () => G("hogar").filter(h => h.freq === "diario");

/* === alertas de Vida (coches, Kerry, salud, hogar con cadencia) === */
function alertas(){
  const out = [], h = hoy();
  const push = (txt, dias, ctx) => out.push({txt, dias, grave: dias <= 3, ctx});
  const porFecha = (f, etq, ctx) => { if (!f) return; const d = difDias(h, f); if (d <= 15) push(etq + (d < 0 ? " venció hace " + (-d) + " d" : d === 0 ? " es hoy" : " en " + d + " d"), d, ctx); };
  DB.coches.forEach(c => { const a = c.alias || "Coche";
    porFecha(c.verif, a + ": verificación", "coche"); porFecha(c.refrendo, a + ": refrendo/tenencia", "coche");
    if (c.seguro) porFecha(c.seguro.vence, a + ": seguro", "coche");
    if (c.servFecha && c.servCadaMes) porFecha(mas(c.servFecha, Math.round(c.servCadaMes*30)), a + ": servicio por tiempo", "coche"); });
  (DB.kerry[0] ? [DB.kerry[0]] : []).forEach(k => {
    if (k.aliFecha && k.aliDura) porFecha(mas(k.aliFecha, +k.aliDura), "Kerry: comprar alimento", "kerry");
    (k.vacunas || []).forEach(v => porFecha(v.proxima, "Kerry: vacuna " + (v.nombre||""), "kerry"));
    (k.despara || []).forEach(v => porFecha(v.proxima, "Kerry: desparasitación " + (v.nombre||""), "kerry")); });
  DB.salud.forEach(s => porFecha(s.proxima, "Salud: " + (s.tipo||"cita"), "salud"));
  G("hogar").forEach(t => { if (t.freq === "cada" && t.cada) { const base = t.ultimo || h; const prox = mas(base, +t.cada);
    const d = difDias(h, prox); if (d <= 1) push(t.nombre + (d < 0 ? ": atrasada " + (-d) + " d" : d === 0 ? ": toca hoy" : ": mañana"), d, "hogar"); } });
  return out.sort((a,b) => a.dias - b.dias);
}

        ${DB.suplementos.length ? '<div class="sub">Suplementos</div>' + DB.suplementos.map(s => `<label class="chk"><input type="checkbox" data-sup="${esc(s.id)}"${(d.sup || {})[s.id] ? " checked" : ""}> ${esc(s.nombre)}</label>`).join("") : ""}</section>
      <section class="panel"><h3>Gasto rápido de hoy</h3><div class="row"><input class="campo" id="hgM" type="number" inputmode="decimal" placeholder="Monto" style="flex:1">
        <select class="campo" id="hgC" style="flex:1">${CATS.map(c => `<option value="${c}">${c}</option>`).join("")}</select><button class="btn" id="hgAdd">Registrar</button></div>
        <p class="aviso" style="margin:8px 0 0">Se guarda en Finanzas › Movimientos como gasto de hoy.</p></section>`;

  function clicH(e){
    if (clicFecha(e)) return; const q = s => e.target.closest(s); let b;
    if (b = q("[data-sueno]")) diaCambia(fecha, d => { d.sueno = Math.max(0, Math.round(((d.sueno || 0) + +b.dataset.sueno) * 2) / 2); });

    else if (b = q("[data-com]")) diaCambia(fecha, d => { d.comidas = Math.min(3, Math.max(0, (d.comidas || 0) + +b.dataset.com)); });

      <div class="row"><input class="campo" id="kn_${lbl}" placeholder="Nombre" style="flex:1" autocomplete="off"><input class="campo" id="kp_${lbl}" type="date" style="flex:1"><button class="btn ch" data-ka="${lbl}">Añadir</button></div>`;

    const render = () => { abrir(cabeza("Ficha de Kerry") + `<div class="dos"><label class="f">Peso (kg)<input id="kPe" value="${esc(k.peso)}" inputmode="decimal"></label><label class="f">Nacimiento / edad<input id="kNa" value="${esc(k.nacimiento)}"></label></div>
      <div class="sub">Alimento</div><label class="f">Marca y presentación<input id="kAM" value="${esc(k.aliMarca)}" autocomplete="off"></label>
      <div class="dos"><label class="f">Fecha de compra<input id="kAF" type="date" value="${esc(k.aliFecha)}"></label><label class="f">Dura (días)<input id="kAD" type="number" value="${esc(k.aliDura)}" inputmode="numeric"></label></div>
      <div class="sub">Veterinario</div><div class="dos"><label class="f">Nombre<input id="kVet" value="${esc(k.vet)}"></label><label class="f">Teléfono<input id="kTel" value="${esc(k.vetTel)}" inputmode="tel"></label></div>
      ${fila(vac,"vacunas")}${fila(des,"despara")}
      <div class="row"><span style="flex:1"></span><button class="btn pri" id="kOk">Guardar ficha</button></div>`);
      document.querySelectorAll("[data-ka]").forEach(btn => btn.onclick = () => { const L = btn.dataset.ka, n = $("kn_"+L).value.trim(); if (!n) return; (L==="vacunas"?vac:des).push({nombre:n, proxima:$("kp_"+L).value}); sincroniza(); render(); });
      $("capa").querySelectorAll("[data-kd]").forEach(b => b.onclick = () => { const [L,i] = b.dataset.kd.split(":"); (L==="vacunas"?vac:des).splice(+i,1); sincroniza(); render(); });
      $("kOk").onclick = () => { sincroniza(); DB.kerry = [k]; cerrar(); if (guardar("kerry")) toast("Ficha de Kerry guardada"); };
    };
    render();
  }
  function hojaSalud(){
    abrir(cabeza("Cita de salud") + `<label class="f">Tipo<input id="lT" placeholder="Dentista, chequeo, terapia, corte…" autocomplete="off"></label>
      <div class="dos"><label class="f">Última<input id="lU" type="date"></label><label class="f">Próxima<input id="lP" type="date"></label></div>
      <div class="aviso">Solo fechas, sin contenido clínico.</div>
      <div class="row"><span style="flex:1"></span><button class="btn pri" id="lOk">Guardar</button></div>`);
    $("lOk").onclick = () => { if (!$("lT").value.trim()) { toast("Escribe el tipo"); return; } DB.salud.push({id:nid(), tipo:$("lT").value.trim(), ultima:$("lU").value, proxima:$("lP").value}); cerrar(); if (guardar("salud")) toast("Cita guardada"); };
  }
  function clicV(e){ const q = s => e.target.closest(s); let b;
    if (q("[data-hn]")) hojaHogar();
    else if (b = q("[data-hhecho]")) { const t = propio("hogar").find(x => x.id === b.dataset.hhecho); if (t) { t.ultimo = hoy(); guardar("hogar"); toast("Marcada hecha hoy"); } }
    else if (b = q("[data-hdel]")) { propio("hogar"); DB.hogar = DB.hogar.filter(x => x.id !== b.dataset.hdel); guardar("hogar"); }
    else if (q("[data-con]")) hojaCoche(null); else if (b = q("[data-coe]")) hojaCoche(b.dataset.coe);
    else if (q("[data-ked]")) hojaKerry();
    else if (q("[data-sln]")) hojaSalud(); else if (b = q("[data-sldel]")) { DB.salud = DB.salud.filter(x => x.id !== b.dataset.sldel); guardar("salud"); }
  }
  MOD.vida = {monta, pinta:pintaV};
})();

/* ---------------- CONSEJO (gobierno + exportación) ---------------- */
(function(){
  let ref = hoy();
  const rango = () => { const l = lunesDe(ref); return {ini:l, fin:mas(l,6)}; };
  function monta(){ $("main").innerHTML = '<div id="cv" class="col"></div>'; $("cv").onclick = clicC; $("cv").onchange = cambioC; }
  function pintaC(){
    if (!$("cv")) return; const r = rango(), c = cfg(), sat = c.satis || {};
    let sinCk = []; for (let s = r.ini; s <= r.fin; s = mas(s,1)) if (!tieneCheckin(DB.dias.find(x => x.id === s))) sinCk.push(fCorta(s));
    const hist = DB.reportes.slice().sort((a,b) => (b.generado||"").localeCompare(a.generado||""));
    $("cv").innerHTML = `<div class="fecha"><button class="cu" data-cs="-7" aria-label="Semana anterior">‹</button><b style="font-size:14px">Semana ${esc(fCorta(r.ini))} – ${esc(fCorta(r.fin))}</b><button class="cu" data-cs="7" aria-label="Semana siguiente">›</button><button class="btn ch" data-cs="0">Hoy</button></div>
      ${sinCk.length ? `<div class="alerta v">⚠️ ${sinCk.length} día(s) sin check-in: ${esc(sinCk.join(", "))}. El reporte lo indicará.</div>` : `<div class="alerta" style="border-left-color:var(--ok)">✓ Semana completa de check-ins.</div>`}
      <section class="panel"><h3>Satisfacción semanal (1 a 10)</h3>${SATIS.map(s => `<div class="sat"><label>${s[1]}</label><input type="range" min="1" max="10" value="${sat[s[0]]||5}" data-sat="${s[0]}"><span class="v">${sat[s[0]]||5}</span></div>`).join("")}</section>
      <section class="panel"><h3>Disyuntiva de la semana para el Consejo</h3><textarea class="campo" id="cDis" rows="2" placeholder="La decisión que quieres llevar a la sesión (opcional)">${esc(c.disyuntiva||"")}</textarea></section>
      <section class="panel"><h3>Los 4 WOOPs</h3>${G("woops").map((w,i) => `<label class="f" style="margin-bottom:8px">${esc(w.nombre)}<input data-woop="${i}" value="${esc(w.nota)}" placeholder="Nota de la semana" autocomplete="off"></label>`).join("")}</section>
      <section class="panel"><div class="cabp"><h3>Proyectos</h3><button class="btn ch pri" data-pyn>Añadir</button></div><div class="lista">${DB.proyectos.length ? DB.proyectos.map(p => `<button class="item" data-pye="${esc(p.id)}"><span class="tx"><span class="nm">${esc(p.nombre)}</span><span class="mt">${esc(p.estado||"activo")} · ${num(p.avance)}% · ${esc(p.proxima||"sin próxima acción")}</span></span></button>`).join("") : '<div class="aviso">Auditoría de rentas, tesis, flipping…</div>'}</div></section>
      <section class="panel"><div class="cabp"><h3>Ideas en espera (moratoria)</h3></div><div class="lista">${DB.ideas.map(i => `<div class="lin2"><span class="tx">${esc(i.texto)}</span><button class="lk" data-idel="${esc(i.id)}">×</button></div>`).join("") || '<div class="aviso">La lista de ideas nuevas que esperan su turno.</div>'}
        <div class="row" style="margin-top:8px"><input class="campo" id="iNueva" placeholder="Nueva idea en espera" style="flex:1" autocomplete="off"><button class="btn" data-ia>Añadir</button></div></section>
      <section class="panel"><h3>Reporte al Consejo</h3><p class="aviso" style="margin:0 0 10px">Arma la semana (lunes a domingo) en JSON y TXT. Esquema versión ${SCHEMA}.</p>
        <div class="row"><button class="btn pri" data-rjson>Descargar JSON</button><button class="btn" data-rtxt>Descargar TXT</button><button class="btn" data-rcopy>Copiar TXT</button></div>
        <button class="btn w" style="margin-top:8px" data-rprev>Ver reporte</button></section>
      ${hist.length ? `<section class="panel"><h3>Historial</h3><div class="lista">${hist.slice(0,8).map(h => `<div class="lin2"><span class="tx">${esc(h.semana?h.semana.inicio+" a "+h.semana.fin:"")}<small>generado ${esc((h.generado||"").slice(0,10))}</small></span><button class="lk" data-rhget="${esc(h.id)}">JSON</button></div>`).join("")}</div></section>` : ""}`;
  }
  function buildReport(){
    const r = rango(), c = cfg(), inW = s => s >= r.ini && s <= r.fin;
    const diasW = DB.dias.filter(d => inW(d.id));
    const ck = diasW.filter(tieneCheckin);
    const nums = (arr,f) => arr.map(f).filter(v => v != null && !isNaN(v));
    const avg = a => a.length ? +(a.reduce((x,y)=>x+y,0)/a.length).toFixed(2) : 0;
    const sueno = nums(ck, d => d.sueno);
    const gymD = ck.filter(d => d.gym && d.gym.si);
    const medD = ck.filter(d => (d.medita||0) > 0);
    const com = nums(ck, d => d.comidas);
    const ani = nums(ck, d => d.animo);
    const horasMin = (window.T_horasArea ? window.T_horasArea(r.ini, r.fin) : {});
    const horas = {}; Object.keys(horasMin).forEach(a => { if (horasMin[a]) horas[a] = +(horasMin[a]/60).toFixed(1); });
    const ing = c.ingreso || {}, vph = {};
    const mIni = mesDe(ref)+"-01", mFin = iso(new Date(fechaDe(ref).getFullYear(), fechaDe(ref).getMonth()+1, 0));
    const hMes = window.T_horasArea ? window.T_horasArea(mIni, mFin) : {};
    AREAS.forEach(a => { const im = num(ing[a[0]]); const hmA = (hMes[a[0]]||0)/60; if (im && hmA) vph[a[0]] = Math.round(im/hmA); });
    const tdiarias = G("hogar").filter(h => h.freq === "diario");
    let casaHechas = 0, casaTot = 0; ck.forEach(d => { const c2 = d.casa || {}; tdiarias.forEach(t => { casaTot++; if (c2[t.id]) casaHechas++; }); });
    let paseos = 0; diasW.forEach(d => paseos += (d.paseos||0));
    const lav = G("hogar").find(h => h.freq === "semana");
    const al = alertas();
    const cochesRep = DB.coches.map(co => ({alias:co.alias||"Coche", km:num(co.km), alertas: al.filter(a => a.ctx==="coche" && a.txt.indexOf((co.alias||"Coche")+":")===0).map(a=>a.txt)}));
    const pend = DB.bloques.filter(b => b.rep === "unico" && b.fecha >= r.ini && b.fecha <= mas(r.fin,14)).sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(b => ({que:b.titulo, fecha:b.fecha}));
    const movW = DB.movimientos.filter(x => inW(x.fecha));
    const gasto = movW.filter(x => x.tipo==="gasto").reduce((s,x)=>s+num(x.monto),0);
    const ingr = movW.filter(x => x.tipo==="ingreso").reduce((s,x)=>s+num(x.monto),0);
    const porCat = {}; movW.filter(x=>x.tipo==="gasto").forEach(x => porCat[x.cat]=(porCat[x.cat]||0)+num(x.monto));
    const mRef = mesDe(r.fin), movM = DB.movimientos.filter(x => mesDe(x.fecha)===mRef);
    const asignado = G("presupuesto").reduce((a,p)=>a+num(p.monto),0), gastadoMes = movM.filter(x=>x.tipo==="gasto").reduce((s,x)=>s+num(x.monto),0);
    const notasW = []; DB.contactos.forEach(ct => (ct.notas||[]).forEach(n => { if (inW(n.fecha)) notasW.push({ct,n}); }));
    const sust = notasW.filter(x => x.n.sust).length;
    const activados = [...new Set(notasW.map(x => x.ct.nombre))];
    const pubs = DB.publicaciones.filter(p => inW(p.fecha)).map(p => ({fecha:p.fecha, red:p.red, tema:p.tema}));
    return {
      schema_version: SCHEMA, generado: new Date().toISOString(), semana: {inicio:r.ini, fin:r.fin},
      presidencia: {
        satisfaccion: Object.fromEntries(SATIS.map(s => [s[0], num((c.satis||{})[s[0]], 5)])),
        woops: G("woops").map(w => ({id:w.id, nombre:w.nombre, nota_semana:w.nota||""})),
        proyectos: DB.proyectos.map(p => ({nombre:p.nombre, estado:p.estado||"activo", avance_pct:num(p.avance), proxima_accion:p.proxima||""})),
        ideas_en_espera: DB.ideas.map(i => i.texto), disyuntiva: c.disyuntiva || ""
      },
      nutricional: {
        dias_con_checkin: ck.length,
        sueno_h: {promedio:avg(sueno), min:sueno.length?Math.min(...sueno):0, max:sueno.length?Math.max(...sueno):0},
        gym: {sesiones:gymD.length, minutos:gymD.reduce((s,d)=>s+num(d.gym.min),0)},
        meditacion: {dias:medD.length, minutos:medD.reduce((s,d)=>s+num(d.medita),0)},
        comidas_completas_promedio: avg(com), animo_promedio: avg(ani),
        citas_salud: DB.salud.filter(s => s.proxima).map(s => ({tipo:s.tipo, proxima:s.proxima}))
      },
      economica: {
        gasto_semana_mxn: Math.round(gasto),
        gasto_por_categoria: Object.fromEntries(Object.entries(porCat).map(([k,v]) => [k, Math.round(v)])),
        ingresos_semana_mxn: Math.round(ingr),
        presupuesto_mes: {asignado:Math.round(asignado), gastado:Math.round(gastadoMes), restante:Math.round(asignado-gastadoMes)},
        deudas: DB.deudas.map(d => ({alias:d.alias, mensualidades_restantes:num(d.restantes), saldo_mxn:Math.round(num(d.saldo))})),
        metas: DB.metas.map(m => ({nombre:m.nombre, objetivo_mxn:Math.round(num(m.objetivo)), aportado_mxn:Math.round(num(m.aportado)), fecha:m.fecha||""}))
      },
      operativa: {
        horas_por_area: horas, valor_hora_mxn: vph,
        tareas_casa_cumplidas_pct: casaTot ? Math.round(casaHechas/casaTot*100) : 0,
        lavanderia_tandas: lav ? num(lav.veces, 2) : 0,
        kerry: {paseos, alertas: al.filter(a => a.ctx==="kerry").map(a=>a.txt)},
        coches: cochesRep, pendientes_con_fecha: pend
      },
      social: {conversaciones_sustantivas: sust, contactos_activados: activados, publicaciones: pubs}
    };
  }
  function toTxt(R){
    const n = R.nutricional, e = R.economica, o = R.operativa, s = R.social, p = R.presidencia;
    const sat = SATIS.map(x => x[1].toLowerCase()+" "+p.satisfaccion[x[0]]).join(", ");
    const horas = Object.entries(o.horas_por_area).map(([k,v]) => (AREAS.find(a=>a[0]===k)||[,k])[1]+" "+v).join(", ") || "—";
    const al = [].concat(...o.coches.map(c=>c.alertas), o.kerry.alertas);
    const L = [];
    L.push(`REPORTE AL CONSEJO · ${R.semana.inicio} a ${R.semana.fin} · ${n.dias_con_checkin}/7 días con check-in`);
    L.push(`NUTRICIONAL  Sueño ${n.sueno_h.promedio} h (mín ${n.sueno_h.min}) · Gym ${n.gym.sesiones} · Meditación ${n.meditacion.dias} días · Comidas ${n.comidas_completas_promedio}/3 · Ánimo ${n.animo_promedio}`);
    L.push(`ECONÓMICA    Gasto ${e.gasto_semana_mxn.toLocaleString("es-MX")} · Presupuesto mes ${e.presupuesto_mes.gastado.toLocaleString("es-MX")}/${e.presupuesto_mes.asignado.toLocaleString("es-MX")}${e.deudas.length?" · "+e.deudas.map(x=>x.alias+": "+x.mensualidades_restantes+" pagos").join("; "):""}`);
    L.push(`OPERATIVA    Horas: ${horas} · Casa ${o.tareas_casa_cumplidas_pct}% · Kerry ${o.kerry.paseos} paseos${al.length?" · Alerta: "+al[0]:""}`);
    L.push(`SOCIAL       ${s.conversaciones_sustantivas} conversación(es) sustantiva(s) · ${s.publicaciones.length} publicación(es)`);
    L.push(`PRESIDENCIA  Satisfacción: ${sat} · Disyuntiva: ${p.disyuntiva||"—"}`);
    return L.join("\n");
  }
  function guardarHist(R){ DB.reportes.push({id:nid(), generado:R.generado, semana:R.semana, json:R}); if (DB.reportes.length > 40) DB.reportes = DB.reportes.slice(-40); guardar("reportes", true); }
  function clicC(e){ const q = s => e.target.closest(s); let b;
    if (b = q("[data-cs]")) { ref = b.dataset.cs === "0" ? hoy() : mas(ref, +b.dataset.cs); pintaC(); return; }
    if (q("[data-pyn]")) return hojaProyecto(null);
    if (b = q("[data-pye]")) return hojaProyecto(b.dataset.pye);
    if (q("[data-ia]")) { const t = $("iNueva").value.trim(); if (!t) return; DB.ideas.push({id:nid(), texto:t}); guardar("ideas"); return; }
    if (b = q("[data-idel]")) { DB.ideas = DB.ideas.filter(x => x.id !== b.dataset.idel); guardar("ideas"); return; }
    if (q("[data-rjson]")) { const R = buildReport(); guardarHist(R); descarga("reporte-consejo_"+R.semana.inicio+".json", JSON.stringify(R, null, 2), "application/json"); return; }
    if (q("[data-rtxt]")) { const R = buildReport(); guardarHist(R); descarga("reporte-consejo_"+R.semana.inicio+".txt", toTxt(R), "text/plain;charset=utf-8"); return; }
    if (q("[data-rcopy]")) { const R = buildReport(); copiar(toTxt(R)); return; }
    if (q("[data-rprev]")) { const R = buildReport(); abrir(cabeza("Reporte al Consejo") + `<div class="rep">${esc(toTxt(R))}</div><div class="sub">JSON (esquema ${SCHEMA})</div><div class="rep">${esc(JSON.stringify(R, null, 2))}</div>
      <div class="row"><button class="btn" id="rpTxt">Descargar TXT</button><button class="btn" id="rpJson">Descargar JSON</button><button class="btn pri" id="rpCopy">Copiar TXT</button></div>`);
      $("rpTxt").onclick = () => { guardarHist(R); descarga("reporte-consejo_"+R.semana.inicio+".txt", toTxt(R), "text/plain;charset=utf-8"); };
      $("rpJson").onclick = () => { guardarHist(R); descarga("reporte-consejo_"+R.semana.inicio+".json", JSON.stringify(R,null,2), "application/json"); };
      $("rpCopy").onclick = () => copiar(toTxt(R)); return; }
    if (b = q("[data-rhget]")) { const h = DB.reportes.find(x => x.id === b.dataset.rhget); if (h) descarga("reporte-consejo_"+h.semana.inicio+".json", JSON.stringify(h.json, null, 2), "application/json"); return; }
  }
  function cambioC(e){ const t = e.target, ds = t.dataset;
    if (ds.sat) { cfgCambia(c => { c.satis = c.satis || {}; c.satis[ds.sat] = +t.value; }, true); t.nextElementSibling.textContent = t.value; }
    else if (ds.woop != null) { propio("woops")[+ds.woop].nota = t.value.trim(); guardar("woops", true); }
    else if (t.id === "cDis") cfgCambia(c => c.disyuntiva = t.value.trim(), true);
  }
  function hojaProyecto(id){
    const p = id ? DB.proyectos.find(x => x.id === id) : {nombre:"",estado:"activo",avance:0,proxima:""}; if (!p) return;
    abrir(cabeza(id ? "Editar proyecto" : "Nuevo proyecto") + `<label class="f">Nombre<input id="yN" value="${esc(p.nombre)}" autocomplete="off"></label>
      <div class="dos"><label class="f">Estado<select id="yE">${["activo","mantenimiento","pausa"].map(s => `<option${p.estado===s?" selected":""}>${s}</option>`).join("")}</select></label><label class="f">Avance %<input id="yA" type="number" min="0" max="100" value="${num(p.avance)}" inputmode="numeric"></label></div>
      <label class="f">Próxima acción<input id="yP" value="${esc(p.proxima)}" autocomplete="off"></label>
      <div class="row">${id ? '<button class="btn peligro" id="yDel">Eliminar</button>' : ""}<span style="flex:1"></span><button class="btn pri" id="yOk">Guardar</button></div>`);
    $("yOk").onclick = () => { if (!$("yN").value.trim()) { toast("Escribe el nombre"); return; } const n = {id:id||nid(), nombre:$("yN").value.trim(), estado:$("yE").value, avance:Math.min(100,Math.max(0,num($("yA").value))), proxima:$("yP").value.trim()};
      const i = DB.proyectos.findIndex(x => x.id === n.id); if (i>=0) DB.proyectos[i] = n; else DB.proyectos.push(n); cerrar(); if (guardar("proyectos")) toast("Proyecto guardado"); };
    if (id) dosPasos($("yDel"), () => { DB.proyectos = DB.proyectos.filter(x => x.id !== id); cerrar(); guardar("proyectos"); });
  }
  MOD.consejo = {monta, pinta:pintaC};
})();

irA("hoy");
arrancar();
</script>
